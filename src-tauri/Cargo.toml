[package]
name = "tome"
description = "Track, Own, Merge, Explore — a desktop client for Lore"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "tome_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1" }

[dependencies]
tome-core = { path = "../crates/tome-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.1" }
