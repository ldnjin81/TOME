name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Read-only token: the workflow only builds and tests.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: UI
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Core tests
        run: cargo test -p tome-core
      - name: App (no installer)
        run: ui/node_modules/.bin/tauri build --no-bundle
        shell: bash
